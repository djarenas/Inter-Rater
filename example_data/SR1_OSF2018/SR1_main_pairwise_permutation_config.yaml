coefficient_to_compute: 'cohen_kappa'
# The panel is unbalanced; each pair uses the subjects both raters rated
balanced_data_only: false
config_of_coefficient:
  n_resamples: 4000
  alpha: 0.05
  random_state: 42
  ci_method: bca
  convergence_test: null
  rater_jackknife: false
  balanced_data_only: true
  injection:
    type: 'extremal'
    strategy: 'contrarian'
    n_new_raters: 1
    random_state: 42
bootstrap_mean_config:
  method: 'correlated'

