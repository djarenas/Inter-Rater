frame_layout:
    use_column_names: false     # The data_SR1.txt file has no headers
    subject_id_col: 'Subject'       # The file has no column holding subject_IDs. The cleaner assumes there are no duplicate subjects and assigns IDs.
case_sensitive: false
strip_whitespace: true
missing_values: ['o']         # v1's marker for "not rated"
value_map: {}                 # nothing needs repairing
unknown_policy: 'error'
unused_categories: 'error'
insufficient_data_drops:
    min_ratings_per_rater:   2
    min_ratings_per_subject: 2
    method:                  iterate
