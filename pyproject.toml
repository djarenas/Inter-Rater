[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interrater"
version = "2.1.0"
description = "Inter-rater agreement for systematic reviews: auditable cleaning, bootstrap intervals, and simulated ratings with known truth"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel J. Arenas"},
]
keywords = [
    "inter-rater-reliability",
    "interrater-agreement",
    "systematic-review",
    "cohens-kappa",
    "fleiss-kappa",
    "krippendorff-alpha",
    "bootstrap",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.6",
]

[project.urls]
Homepage = "https://github.com/djarenas/Inter-Rater"
Repository = "https://github.com/djarenas/Inter-Rater"
Issues = "https://github.com/djarenas/Inter-Rater/issues"
"Prior version (arXiv)" = "https://arxiv.org/abs/1809.05731"
"Prior version (Zenodo)" = "https://doi.org/10.5281/zenodo.1227660"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/interrater"]
